<title>Дашборд власника We.Code</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Шар керівника: зверху — місяць і компанія, далі картки керівників, наради — окрема вкладка */
:root{--bg:#f6f6f3;--panel:#fff;--fg:#1d1f22;--muted:#686b70;--line:#e2e1db;--acc:#2f5d8a;--accbg:#e6eef6;--ok:#2d7a4b;--okbg:#e3f1e8;--warn:#9a6511;--warnbg:#f7ecd8;--bad:#b0402c;--badbg:#f7e3de;--ref:#8d8f93;
 --c1:#2a78d6;--c2:#e2672f;--c3:#1a9e72;--c4:#c98a00;--c5:#7b5fd6;
 --serif:Georgia,"Iowan Old Style","Times New Roman",serif;--sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#18191b;--panel:#222326;--fg:#ebeae6;--muted:#a2a39f;--line:#38393c;--acc:#8fb4e6;--accbg:#22303f;--ok:#6cc08d;--okbg:#1f3328;--warn:#e0b25a;--warnbg:#3a2f1c;--bad:#ea8571;--badbg:#3d2621;--ref:#8a8b8f;--c1:#4f95ea;--c2:#ee8452;--c3:#3bbd8e;--c4:#e0a524;--c5:#9d86ee;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#18191b;--panel:#222326;--fg:#ebeae6;--muted:#a2a39f;--line:#38393c;--acc:#8fb4e6;--accbg:#22303f;--ok:#6cc08d;--okbg:#1f3328;--warn:#e0b25a;--warnbg:#3a2f1c;--bad:#ea8571;--badbg:#3d2621;--ref:#8a8b8f;--c1:#4f95ea;--c2:#ee8452;--c3:#3bbd8e;--c4:#e0a524;--c5:#9d86ee;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 var(--sans);font-variant-numeric:tabular-nums}
.wrap{max-width:1240px;margin:0 auto;padding-block:20px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:22px}
h1{font:400 28px/1.15 var(--serif);margin:0;text-wrap:balance}
h2{font-size:16px;margin:0;text-wrap:balance}h3{font-size:14px;margin:0}
.muted{color:var(--muted)}.note{color:var(--muted);font-size:12px;margin:0}
.top{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:flex-end;justify-content:space-between}
.top .tl{display:grid;gap:4px;min-width:0}
.ctrl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
select,button,input,textarea{font:inherit;color:var(--fg)}
select{padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 14px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.tab[aria-selected=true]{background:var(--fg);color:var(--bg);border-color:var(--fg);font-weight:600}
.tab:focus-visible,button:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.badge{background:var(--bad);color:#fff;border-radius:999px;font-size:11px;font-weight:700;padding:0 6px;line-height:18px}
.take{margin:0;font-size:15px;max-width:90ch}
.tiles{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,11rem),1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;min-width:0;display:grid;gap:8px;align-content:start}
.tile .lab{font-size:12px;color:var(--muted)}.tile .big{font:400 26px/1.1 var(--serif)}.tile .sm{font-size:12px;color:var(--muted)}
.good{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}.mut{color:var(--muted)}
.sec{display:grid;gap:10px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,22rem),1fr))}
.leaders{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,19rem),1fr))}
.lc .hd{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:12.5px}
.kv span:nth-child(odd){color:var(--muted)}.kv b{font-weight:600}
.pill{display:inline-block;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:600}
.pill.good{background:var(--okbg)}.pill.warn{background:var(--warnbg)}.pill.bad{background:var(--badbg)}.pill.mut{background:var(--bg)}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:right;color:var(--muted);font-weight:600;font-size:11px;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:bottom}
td{text-align:right;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child,td.l{text-align:left}
td .who{font-weight:600}td .ar{display:block;color:var(--muted);white-space:normal;min-width:12ch;font-size:11.5px}
.chart{position:relative}.chart svg{display:block}
.tip{position:absolute;pointer-events:none;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,.14);padding:6px 10px;font-size:12px;white-space:nowrap;z-index:2}
.tip .t{color:var(--muted);margin-bottom:2px}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.lg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted)}
dl{display:grid;grid-template-columns:minmax(9rem,max-content) 1fr;gap:8px 16px;margin:0;font-size:13px}dt{font-weight:600}dd{margin:0;color:var(--muted)}
@media (max-width:560px){dl{grid-template-columns:1fr}}
.banner{border:1px solid var(--line);background:var(--accbg);border-radius:10px;padding:10px 14px;font-size:13px}
/* наради */
.mt-head{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
.mt-sum{display:flex;flex-wrap:wrap;gap:6px}
.rec{border-top:1px solid var(--line);padding-top:10px;display:grid;gap:6px}
.rec:first-of-type{border-top:0;padding-top:0}
.rec .tx{font-size:13.5px}
.rec .tag{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.prog{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted);align-items:center}
.prog b{color:var(--fg);font-weight:600}
.acts{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--panel);padding:4px 10px;cursor:pointer;font-size:12.5px;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed=true].s-done{background:var(--okbg);color:var(--ok);font-weight:600}
.seg button[aria-pressed=true].s-part{background:var(--warnbg);color:var(--warn);font-weight:600}
.seg button[aria-pressed=true].s-fail{background:var(--badbg);color:var(--bad);font-weight:600}
.asg{display:inline-flex;gap:6px;align-items:center;font-size:12.5px;cursor:pointer;border:1px solid var(--line);border-radius:8px;padding:4px 10px;background:var(--panel)}
.asg input{margin:0}
.asg.on{border-color:var(--acc);color:var(--acc);font-weight:600;background:var(--accbg)}
.notein{width:100%;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:6px 8px;font-size:12.5px;resize:vertical;min-height:32px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:10px;font-size:13px;z-index:9}
</style>
<div class="wrap">
  <div class="top">
    <div class="tl"><h1>Дашборд власника We.Code</h1><p class="note" id="asof">Завантаження даних…</p></div>
    <div class="ctrl">
      <label class="note" for="msel">Місяць</label><select id="msel" aria-label="Місяць"></select>
    </div>
  </div>
  <div class="tabs" role="tablist" id="tabs">
    <button class="tab" role="tab" data-t="ov" id="tab-ov">Огляд</button>
    <button class="tab" role="tab" data-t="mt" id="tab-mt">Наради й задачі</button>
    <button class="tab" role="tab" data-t="how" id="tab-how">Як рахується</button>
  </div>
  <div id="page"></div>
</div>
<script>
(() => {
const S = {tab: 'ov', month: '', L: [], M: [], G: [], A: null, meetings: [], marks: {}, mt: '', db: null, me: null, err: ''};
try { const t = localStorage.getItem('ow_tab'); if (t) S.tab = t; } catch (e) {}
if (['ov', 'mt', 'how'].includes(location.hash.slice(1))) S.tab = location.hash.slice(1);
const el = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; };
const nf = new Intl.NumberFormat('uk-UA', {maximumFractionDigits: 0});
const N = (v) => v == null ? '—' : nf.format(v), H = (v) => v == null ? '—' : nf.format(v) + ' год', P = (v) => v == null ? '—' : v + '%';
const SG = (v) => v == null ? '—' : (v > 0 ? '+' : v < 0 ? '−' : '±') + nf.format(Math.abs(v)) + ' год';
const MS = ['січ', 'лют', 'бер', 'кві', 'тра', 'чер', 'лип', 'сер', 'вер', 'жов', 'лис', 'гру'];
const MF = ['січень', 'лютий', 'березень', 'квітень', 'травень', 'червень', 'липень', 'серпень', 'вересень', 'жовтень', 'листопад', 'грудень'];
const MG = ['січня', 'лютого', 'березня', 'квітня', 'травня', 'червня', 'липня', 'серпня', 'вересня', 'жовтня', 'листопада', 'грудня'];
const ms = (m) => MS[+m.slice(5, 7) - 1] + ' ' + m.slice(2, 4), mf = (m) => MF[+m.slice(5, 7) - 1] + ' ' + m.slice(0, 4), mg = (m) => MG[+m.slice(5, 7) - 1];
const dd = (d) => d ? d.slice(8, 10) + '.' + d.slice(5, 7) + '.' + d.slice(0, 4) : '—';
const before = (m) => { let y = +m.slice(0, 4), k = +m.slice(5, 7) - 1; if (!k) { y--; k = 12; } return y + '-' + String(k).padStart(2, '0'); };
const uC = (v) => v == null ? 'mut' : v >= 80 ? 'good' : v >= 50 ? 'warn' : 'bad';
const pC = (v) => v == null ? 'mut' : v >= 100 ? 'good' : v >= 85 ? 'warn' : 'bad';
const ORDER = ['marina', 'anna', 'svitlana', 'lcw', 'natalia'];
const COL = {marina: 'var(--c1)', anna: 'var(--c2)', svitlana: 'var(--c3)', lcw: 'var(--c4)', natalia: 'var(--c5)'};
const NAMES = {marina: 'Марина Васильєва', anna: 'Анна Воропаєва', svitlana: 'Світлана Степура', lcw: 'Іван Губченко', natalia: 'Свідрук Наталя'};
const toast = (t) => { const x = el('div', 'toast', t); document.body.append(x); setTimeout(() => x.remove(), 2600); };
const cur = () => S.A ? S.A.month : '';
const rowsOf = (m) => S.L.filter((r) => r.month === m).sort((a, b) => ORDER.indexOf(a.key) - ORDER.indexOf(b.key));

function company(m) {
  const L = rowsOf(m), d = L.filter((r) => r.kind === 'direction');
  const s = (k, rs = d) => rs.reduce((a, r) => a + (Number(r[k]) || 0), 0);
  const pl = d.filter((r) => r.plan);
  const isCur = m === cur();
  // утилізація: для закритого місяця — сам місяць, для поточного — минулий
  const um = isCur ? before(m) : m;
  const umr = S.M.filter((r) => r.month === um && r.key !== 'natalia');
  const t = s('tails_h'), tp = s('prev_tails_h');
  return {isCur, um, fact: s('fact'), prev_fact: s('prev_fact'), forecast: s('forecast', pl), plan: s('plan', pl),
    fpct: s('plan', pl) ? Math.round(s('forecast', pl) / s('plan', pl) * 100) : null,
    paid: s('paid_h', umr), util: s('fact', umr) ? Math.round(s('paid_h', umr) / s('fact', umr) * 100) : null,
    tails: t, tdelta: d.every((r) => r.prev_tails_h != null) ? Math.round(t - tp) : null, done: s('tails_done_h'), overdue: s('overdue')};
}

/* ---------- огляд ---------- */
function overview(pg) {
  const m = S.month, c = company(m), isCur = c.isCur;
  if (!rowsOf(m).length) { pg.append(el('p', 'muted', 'Немає даних за цей місяць.')); return; }
  if (!isCur) pg.append(el('div', 'banner', 'Закритий місяць ' + mf(m) + ': факт на кінець місяця. Утилізація — частка годин ' + mg(m) + ', які вже оплачені станом на ' + dd(S.A.date) + ', тож вона ще може зрости.'));
  const take = el('p', 'take');
  const a = c.fpct == null ? '' : (isCur ? 'Напрями йдуть на ' : 'Напрями закрили місяць на ') + c.fpct + '% плану';
  const b = c.util == null ? '' : ', оплачено ' + c.util + '% годин ' + (isCur ? 'минулого місяця' : 'цього місяця');
  const t = c.tdelta == null ? '.' : '; хвости ' + (c.tdelta > 0 ? 'зросли на ' : 'зменшились на ') + N(Math.abs(c.tdelta)) + ' год за місяць.';
  take.textContent = a + b + t; pg.append(take);

  const tiles = el('div', 'tiles');
  const tile = (lab, big, cls, sm, smcls) => { const d = el('div', 'card tile'); d.append(el('span', 'lab', lab), el('span', 'big ' + (cls || ''), big), el('span', 'sm ' + (smcls || ''), sm)); tiles.append(d); };
  tile(isCur ? 'Прогноз до плану напрямів' : 'Виконання плану напрямів', P(c.fpct), pC(c.fpct), N(c.forecast) + ' з ' + N(c.plan) + ' год плану');
  tile('Годин за ' + (isCur ? 'місяць (поки)' : 'місяць'), H(c.fact), '', 'місяць до того — ' + H(c.prev_fact));
  tile('Утилізація: ' + mf(c.um), P(c.util), uC(c.util), 'оплачено ' + N(c.paid) + ' год, мета 80%');
  tile('Хвости минулих місяців', H(c.tails), '', c.tdelta == null ? '—' : SG(c.tdelta) + ' за місяць', c.tdelta > 0 ? 'bad' : 'good');
  tile('Здано, не оплачено (DONE)', H(c.done), '', 'хвости в етапі DONE');
  tile('Прострочені задачі', N(c.overdue), '', 'відкриті задачі з минулим строком');
  const s1 = el('section', 'sec'); s1.append(el('h2', null, 'Компанія загалом'), tiles); pg.append(s1);

  const s2 = el('section', 'sec'); s2.append(el('h2', null, 'Керівники'));
  const box = el('div', 'leaders');
  for (const r of rowsOf(m)) box.append(leaderCard(r, isCur));
  s2.append(box); pg.append(s2);

  pg.append(compareTable(m, isCur));
  const s3 = el('section', 'sec'); s3.append(el('h2', null, 'Динаміка по місяцях'), el('p', 'note', 'Вибраний місяць підсвічено. Поточний місяць ще не закритий — він світлішим.'));
  const g = el('div', 'grid');
  g.append(chartCard('Години напрямів', 'Факт годин до норми; пунктир — сума планів напрямів.', (el2) => hoursChart(el2)));
  g.append(chartCard('Утилізація', 'Частка годин місяця на задачах, які вже в PAID\\CLOSE. Мета 80%.', (el2) => lineChart(el2, 'util', (v) => v + '%', 80)));
  g.append(chartCard('Хвости на кінець місяця', 'Години в незакритих задачах, створених до цього місяця.', (el2) => lineChart(el2, 'tails_h', N, 0)));
  s3.append(g); pg.append(s3);
  pg.append(managersTable(m, isCur));
}

function leaderCard(r, isCur) {
  const c = el('article', 'card lc'); c.id = 'leader-' + r.key;
  const hd = el('div', 'hd'); hd.append(el('h3', null, r.leader));
  const useU = r.kind === 'commerce' || r.forecast_pct == null;
  const uval = isCur ? r.prev_util : r.util;
  hd.append(el('span', 'pill ' + (useU ? uC(uval) : pC(r.forecast_pct)), useU ? 'утилізація ' + P(uval) : (isCur ? 'прогноз ' : 'план ') + P(r.forecast_pct)));
  c.append(hd, el('div', 'note', r.area + (r.people ? ' · ' + r.people + (r.kind === 'commerce' ? ' менеджерів' : ' людей') : '')));
  const kv = el('div', 'kv');
  const add = (k, v, cls) => { kv.append(el('span', null, k)); kv.append(el('b', cls || '', v)); };
  if (r.kind === 'commerce') {
    add('Години по проєктах', H(r.fact)); add('Місяць до того', H(r.prev_fact));
    add('Утилізація ' + (isCur ? 'минулого місяця' : 'місяця'), P(uval), uC(uval));
    if (isCur) add('Утилізація зараз', P(r.util), 'mut');
  } else {
    add('План / факт', (r.plan ? N(r.plan) : 'без плану') + ' / ' + H(r.fact));
    if (isCur) add('Прогноз на кінець місяця', H(r.forecast) + (r.forecast_pct != null ? ' · ' + r.forecast_pct + '%' : ''), pC(r.forecast_pct));
    add('Місяць до того', H(r.prev_fact) + (r.prev_pct != null ? ' · ' + r.prev_pct + '% плану' : ''));
    add('Утилізація ' + (isCur ? 'минулого місяця' : 'місяця'), P(uval), uC(uval));
  }
  const d = r.tails_h != null && r.prev_tails_h != null ? Math.round(r.tails_h - r.prev_tails_h) : null;
  add('Хвости', H(r.tails_h) + (d != null ? ' (' + SG(d) + ')' : ''), d > 0 ? 'bad' : d < 0 ? 'good' : '');
  add('З них DONE — чекають оплати', H(r.tails_done_h), r.tails_done_h > 200 ? 'warn' : '');
  if (r.kind !== 'commerce') { add('Прострочені задачі', N(r.overdue), r.overdue > 20 ? 'bad' : r.overdue > 5 ? 'warn' : ''); add('Під ризиком недобору норми', N(r.at_risk) + ' з ' + N(r.people)); }
  else add('Проєктів без менеджера', N(r.unassigned), r.unassigned ? 'warn' : '');
  c.append(kv);
  // відкриті задачі з нарад
  const open = openTasks(r.key);
  if (open.n) { const x = el('div', 'note'); x.append('Задачі з нарад: '); x.append(el('b', open.fail ? 'bad' : '', open.done + ' з ' + open.n + ' виконано')); c.append(x); }
  const mini = el('div', 'chart'); c.append(el('div', 'note', 'Утилізація по місяцях (пунктир — 80%)'), mini);
  requestAnimationFrame(() => miniUtil(mini, r.key));
  return c;
}

function compareTable(m, isCur) {
  const c = el('div', 'card'); c.append(el('h2', null, 'Порівняння керівників'), el('p', 'note', (isCur ? 'Поточний місяць наростаючим підсумком; утилізація — за минулий місяць.' : 'Підсумок місяця; утилізація — за цей місяць станом на сьогодні.') + ' У комерції години — усі години по проєктах менеджерів.'));
  const t = el('table'); const th = el('thead'); const hr = el('tr');
  ['Керівник', 'План, год', 'Факт, год', isCur ? 'Прогноз до плану' : 'Виконання плану', 'Місяць до того', 'Утилізація', 'Хвости, год', 'За місяць', 'З них DONE', 'Прострочено', 'Індекс'].forEach((x) => hr.append(el('th', null, x)));
  th.append(hr); t.append(th); const tb = el('tbody');
  for (const r of rowsOf(m)) {
    const tr = el('tr'); const td = (v, cls) => { const x = el('td', cls || '', v); tr.append(x); };
    const f = el('td'); f.append(el('span', 'who', r.leader), el('span', 'ar', r.area)); tr.append(f);
    const u = isCur ? r.prev_util : r.util; const d = r.tails_h != null && r.prev_tails_h != null ? Math.round(r.tails_h - r.prev_tails_h) : null;
    td(r.plan == null ? '—' : N(r.plan)); td(N(r.fact)); td(P(r.forecast_pct), pC(r.forecast_pct)); td(P(r.prev_pct), pC(r.prev_pct)); td(P(u), uC(u));
    td(N(r.tails_h)); td(d == null ? '—' : SG(d), d > 0 ? 'bad' : d < 0 ? 'good' : ''); td(N(r.tails_done_h)); td(N(r.overdue));
    td(r.health == null ? '—' : N(r.health), r.health == null ? '' : r.health >= 75 ? 'good' : r.health >= 60 ? 'warn' : 'bad');
    tb.append(tr);
  }
