<title>Дашборд власника We.Code</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
/* Звіт власника: шапка з місяцями → підсумок одним реченням → 6 показників компанії → картки керівників → порівняння → динаміка → комерція */
:root{--bg:#f3f4f6;--panel:#fff;--ink:#17202a;--muted:#5d6874;--faint:#8a939d;--line:#e2e5e9;--soft:#f7f8fa;--acc:#1f4e8c;--accbg:#e8eef7;
 --ok:#21794a;--okbg:#e4f2ea;--warn:#a1650c;--warnbg:#f8eedb;--bad:#b23a26;--badbg:#f8e5e0;--ref:#9aa2ab;
 --c1:#2f6fd6;--c2:#e0662c;--c3:#179a6e;--c4:#c48a07;--c5:#7656d6;
 --serif:"Source Serif 4",Georgia,serif;--sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;--r:12px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121518;--panel:#1b1f24;--ink:#e9ecef;--muted:#a3acb6;--faint:#7c858f;--line:#2d333a;--soft:#20252b;--acc:#8db4ee;--accbg:#1e2b3d;--ok:#69c08e;--okbg:#1b3125;--warn:#e2b15a;--warnbg:#382d19;--bad:#ef8670;--badbg:#3c231e;--ref:#6f7882;--c1:#5b95ee;--c2:#f08a57;--c3:#3cc191;--c4:#e2aa2c;--c5:#9d88f0;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121518;--panel:#1b1f24;--ink:#e9ecef;--muted:#a3acb6;--faint:#7c858f;--line:#2d333a;--soft:#20252b;--acc:#8db4ee;--accbg:#1e2b3d;--ok:#69c08e;--okbg:#1b3125;--warn:#e2b15a;--warnbg:#382d19;--bad:#ef8670;--badbg:#3c231e;--ref:#6f7882;--c1:#5b95ee;--c2:#f08a57;--c3:#3cc191;--c4:#e2aa2c;--c5:#9d88f0;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans);font-variant-numeric:tabular-nums}
.wrap{max-width:1260px;margin:0 auto;padding-block:24px 72px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:28px}
h1{font:600 30px/1.1 var(--serif);margin:0;letter-spacing:-.01em;text-wrap:balance}
h2{font:600 20px/1.2 var(--serif);margin:0;text-wrap:balance}
h3{font-size:15px;font-weight:600;margin:0}
.muted{color:var(--muted)}.note{color:var(--muted);font-size:12.5px;margin:0}
.good{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}.mut{color:var(--faint)}
select,button,input,textarea{font:inherit;color:var(--ink)}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
/* шапка */
.top{display:grid;gap:16px}
.top .row{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between}
.top .tl{display:grid;gap:6px;min-width:0}
.eyebrow{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.months{display:inline-flex;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.months button{border:0;background:transparent;border-radius:7px;padding:6px 12px;cursor:pointer;color:var(--muted);font-weight:500;white-space:nowrap}
.months button:hover{color:var(--ink)}
.months button[aria-pressed=true]{background:var(--ink);color:var(--panel)}
.months button .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--ok);margin-left:6px;vertical-align:1px}
.tabs{display:flex;gap:22px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{border:0;background:none;padding:10px 0;margin-bottom:-1px;border-bottom:2px solid transparent;cursor:pointer;color:var(--muted);font-weight:500;display:inline-flex;gap:8px;align-items:center;white-space:nowrap}
.tab[aria-selected=true]{color:var(--ink);border-bottom-color:var(--ink);font-weight:600}
.badge{background:var(--bad);color:#fff;border-radius:999px;font-size:11px;font-weight:600;padding:0 7px;line-height:18px}
/* підсумок */
.lede{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;align-items:baseline}
.lede .when{font-size:12.5px;color:var(--muted);white-space:nowrap}
.lede p{margin:0;font:400 21px/1.4 var(--serif);max-width:68ch;text-wrap:pretty}
@media (max-width:640px){.lede{grid-template-columns:1fr}.lede p{font-size:18px}}
.banner{border:1px solid var(--line);background:var(--accbg);border-radius:var(--r);padding:10px 14px;font-size:13px}
.sec{display:grid;gap:14px}
.sec>.sh{display:flex;flex-wrap:wrap;gap:4px 16px;align-items:baseline;justify-content:space-between}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0;display:grid;gap:12px;align-content:start}
/* показники */
.tiles{display:grid;gap:12px;grid-template-columns:repeat(6,minmax(0,1fr))}
@media (max-width:1100px){.tiles{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:620px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.tile .big{font-size:26px}}
.tile{gap:6px;align-content:space-between}
.tile .lab{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.tile .big{font:600 32px/1.05 var(--serif);letter-spacing:-.01em}
.tile .big small{font:500 14px var(--sans);color:var(--muted);margin-left:4px}
.tile .sm{font-size:12.5px;color:var(--muted)}
.bar{position:relative;height:6px;border-radius:3px;background:var(--soft);overflow:visible;margin-top:2px}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:3px}
.bar em{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.55}
/* керівники */
.leaders{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,17rem),1fr))}
.lc.wide{grid-column:1/-1;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1fr);column-gap:22px;align-items:start}
.lc.wide>.who,.lc.wide>.foot{grid-column:1/-1}
.lc.wide.eng{display:block}.lc.wide.eng>*+*{margin-top:10px}.lc.wide.eng .kv{max-width:640px}
@media (max-width:900px){.lc.wide{grid-template-columns:1fr}}
.lc{gap:14px}
.lc .who{display:flex;gap:12px;align-items:center;min-width:0}
.ava{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:13px;color:#fff}
.lc .who .nm{display:grid;min-width:0}.lc .who .ar{font-size:12.5px;color:var(--muted)}
.hero{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.hero>div{padding:10px 12px;display:grid;gap:2px;min-width:0}
.hero>div+div{border-left:1px solid var(--line)}
.hero .k{font-size:10.5px;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero .v{font:600 22px/1.15 var(--serif)}
.hero .d{font-size:12px;color:var(--muted)}
.kv{display:grid;grid-template-columns:1fr auto;font-size:13px}
.kv span,.kv b{padding:6px 0;border-top:1px solid var(--line)}
.kv span:nth-child(-n+2),.kv b:nth-child(-n+2){border-top:0}
.kv span{color:var(--muted)}.kv b{font-weight:600;text-align:right}
.spark .cap{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:4px}
.foot{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.good{background:var(--okbg)}.pill.warn{background:var(--warnbg)}.pill.bad{background:var(--badbg)}.pill.mut{background:var(--soft);color:var(--muted)}
/* таблиці */
.tw{overflow-x:auto;margin:0 -18px;padding:0 18px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:right;color:var(--muted);font-weight:600;font-size:11px;letter-spacing:.04em;text-transform:uppercase;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:bottom}
td{text-align:right;padding:10px;border-bottom:1px solid var(--line);white-space:nowrap}
tbody tr:hover td{background:var(--soft)}
tbody tr:last-child td{border-bottom:0}
th:first-child,td:first-child,td.l{text-align:left}
td .who2{display:flex;gap:10px;align-items:center}
td .who2 .ava{width:28px;height:28px;font-size:11px}
td .tsub{display:block;color:var(--muted);font-size:12px;font-weight:400}
td .who2 span.ar{display:block;color:var(--muted);font-size:12px;white-space:normal}
.cellbar{display:inline-flex;align-items:center;gap:8px;justify-content:flex-end}
.cellbar i{display:inline-block;height:6px;border-radius:3px;background:var(--ref);opacity:.5}
/* графіки */
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,24rem),1fr))}
.chart{position:relative}.chart svg{display:block;overflow:visible}
.tip{position:absolute;pointer-events:none;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(15,23,42,.14);padding:8px 12px;font-size:12.5px;white-space:nowrap;z-index:2;display:grid;gap:2px}
.tip .t{color:var(--muted);font-weight:600}
.sw{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;vertical-align:0}
.lg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted)}
dl{display:grid;grid-template-columns:minmax(10rem,max-content) 1fr;gap:12px 20px;margin:0;font-size:13.5px}dt{font-weight:600}dd{margin:0;color:var(--muted);max-width:75ch}
@media (max-width:560px){dl{grid-template-columns:1fr}.hero .v{font-size:19px}}
/* наради */
.mt-head{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:flex-end;justify-content:space-between}
select{padding:7px 10px;border:1px solid var(--line);border-radius:9px;background:var(--panel)}
.mrows{display:grid;gap:12px}
.mrow{grid-template-columns:minmax(150px,180px) minmax(0,1fr);column-gap:18px;align-items:start}
.mside{display:grid;gap:10px;align-content:start;position:sticky;top:8px}
.rh-list{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(178px,1fr);gap:8px;overflow-x:auto;padding-bottom:4px}
.res{display:grid;grid-template-columns:1fr;gap:4px}
.rb{display:flex;flex-direction:row;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:5px 10px;cursor:pointer;color:var(--muted);min-width:0;width:100%;text-align:left;font-size:12.5px}
.rb .ic{flex:none;width:16px;text-align:center;font-size:13px;line-height:1;font-weight:700}.rb .lb{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rb:hover{border-color:var(--ink);color:var(--ink)}
.rb.s-done[aria-pressed=true]{background:var(--ok);border-color:var(--ok);color:#fff}
.rb.s-part[aria-pressed=true]{background:var(--warn);border-color:var(--warn);color:#fff}
.rb.s-fail[aria-pressed=true]{background:var(--bad);border-color:var(--bad);color:#fff}
#page{display:grid;gap:24px}
td a{color:var(--ink);text-decoration-color:var(--line);text-underline-offset:3px}td a:hover{text-decoration-color:var(--ink)}
.saved{font-size:11.5px;min-height:14px}
.res-row{display:flex;gap:4px;flex-wrap:nowrap}.res-row .rb{width:auto;padding:4px 9px}
.rec.tile{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--soft);display:flex;flex-direction:column;gap:8px;min-width:0}
.rec.tile:first-of-type{border-top:1px solid var(--line);padding-top:12px}
.rec.tile .rtop{display:flex;gap:8px;align-items:center}
.rec.tile .tag{margin:0}
.rec.tile .tx{flex:1}
.rec.tile .prog,.rec.tile .acts{padding-left:0}
.rec.tile .tx{font-size:13px}
.rec.tile .prog{display:flex;flex-wrap:wrap;gap:2px 5px;align-items:baseline}
.rec.tile .prog .pill{flex-basis:auto}
.rec.tile .seg{display:flex;flex-wrap:wrap;width:100%}.rec.tile .seg button{flex:1 1 auto;padding:5px 6px;font-size:12px}
.rec.tile .asg{padding:4px 9px}
.rec.tile .notein{margin-left:0;width:100%}
.rec.tile.fall{border-color:var(--warn)}.rec.tile.fall .tag{color:var(--warn)}
.rec.tile.st-asg{background:var(--accbg)}.rec.tile.st-done{background:var(--okbg)}.rec.tile.st-part{background:var(--warnbg)}.rec.tile.st-fail{background:var(--badbg)}
@media (max-width:760px){.mrow{grid-template-columns:1fr}.mside{position:static;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center}.rh-list{grid-auto-columns:minmax(250px,85%)}}
.rec{border-top:1px solid var(--line);padding-top:12px;display:grid;gap:8px}
.rec:first-of-type{border-top:0;padding-top:0}
.rec .rh{display:flex;gap:10px;align-items:flex-start}
.rec .num{flex:none;width:22px;height:22px;border-radius:50%;background:var(--soft);border:1px solid var(--line);display:grid;place-items:center;font-size:11.5px;font-weight:600;color:var(--muted)}
.rec .tx{font-size:13.5px}
.lc .tag{font-size:11px;text-transform:uppercase;letter-spacing:.06em;font-weight:600;margin-top:4px}
.rec .tag{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600;display:block;margin-bottom:2px}
.prog{display:grid;gap:4px;font-size:12px;color:var(--muted);padding-left:32px}
.prog .nums{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.prog b{color:var(--ink);font-weight:600}
.acts{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding-left:32px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{border:0;background:var(--panel);padding:5px 11px;cursor:pointer;font-size:12.5px;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed=true].s-done{background:var(--okbg);color:var(--ok);font-weight:600}
.seg button[aria-pressed=true].s-part{background:var(--warnbg);color:var(--warn);font-weight:600}
.seg button[aria-pressed=true].s-fail{background:var(--badbg);color:var(--bad);font-weight:600}
.asg{display:inline-flex;gap:7px;align-items:center;font-size:12.5px;cursor:pointer;border:1px solid var(--line);border-radius:9px;padding:5px 11px;background:var(--panel)}
.asg input{margin:0}
.asg.on{border-color:var(--acc);color:var(--acc);font-weight:600;background:var(--accbg)}
.notein{margin-left:32px;width:calc(100% - 32px);border:1px solid var(--line);border-radius:9px;background:var(--soft);padding:7px 9px;font-size:12.5px;resize:vertical;min-height:34px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--panel);padding:10px 16px;border-radius:10px;font-size:13px;z-index:9}
</style>
<div class="wrap">
  <header class="top">
    <div class="row">
      <div class="tl"><span class="eyebrow">We.Code · звіт власника</span><h1>Дашборд власника</h1><p class="note" id="asof">Завантаження даних…</p></div>
      <div class="months" id="months" role="group" aria-label="Місяць"></div>
    </div>
    <nav class="tabs" role="tablist" id="tabs">
      <button class="tab" role="tab" data-t="ov" id="tab-ov">Огляд</button>
      <button class="tab" role="tab" data-t="tl" id="tab-tl">Хвости</button>
      <button class="tab" role="tab" data-t="en" id="tab-en">Залученість</button>
      <button class="tab" role="tab" data-t="ps" id="tab-ps">Пресейли</button>
      <button class="tab" role="tab" data-t="mt" id="tab-mt">Наради й задачі</button>
      <button class="tab" role="tab" data-t="how" id="tab-how">Як рахується</button>
    </nav>
  </header>
  <div id="page"></div>
</div>
<script>
(() => {
const S = {pre: {}, tab: 'ov', month: '', L: [], M: [], G: [], A: null, meetings: [], marks: {}, mt: '', db: null, me: null, err: ''};
try { const t = localStorage.getItem('ow_tab'); if (t) S.tab = t; } catch (e) {}
if (['ov', 'tl', 'en', 'ps', 'mt', 'how'].includes(location.hash.slice(1))) S.tab = location.hash.slice(1);
const el = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; };
const nf = new Intl.NumberFormat('uk-UA', {maximumFractionDigits: 0});
const N = (v) => v == null ? '—' : nf.format(v), H = (v) => v == null ? '—' : nf.format(v) + ' год', P = (v) => v == null ? '—' : v + '%';
const SG = (v) => v == null ? '—' : (v > 0 ? '+' : v < 0 ? '−' : '±') + nf.format(Math.abs(v)) + ' год';
const MS = ['січ', 'лют', 'бер', 'кві', 'тра', 'чер', 'лип', 'сер', 'вер', 'жов', 'лис', 'гру'];
const MF = ['січень', 'лютий', 'березень', 'квітень', 'травень', 'червень', 'липень', 'серпень', 'вересень', 'жовтень', 'листопад', 'грудень'];
const MG = ['січня', 'лютого', 'березня', 'квітня', 'травня', 'червня', 'липня', 'серпня', 'вересня', 'жовтня', 'листопада', 'грудня'];
const ms = (m) => MS[+m.slice(5, 7) - 1] + ' ' + m.slice(2, 4), mf = (m) => MF[+m.slice(5, 7) - 1] + ' ' + m.slice(0, 4), mg = (m) => MG[+m.slice(5, 7) - 1];
const dd = (d) => d ? d.slice(8, 10) + '.' + d.slice(5, 7) + '.' + d.slice(0, 4) : '—';
const before = (m) => { let y = +m.slice(0, 4), k = +m.slice(5, 7) - 1; if (!k) { y--; k = 12; } return y + '-' + String(k).padStart(2, '0'); };
const uC = (v) => v == null ? 'mut' : v >= 80 ? 'good' : v >= 50 ? 'warn' : 'bad';
const pC = (v) => v == null ? 'mut' : v >= 100 ? 'good' : v >= 85 ? 'warn' : 'bad';
const ORDER = ['marina', 'anna', 'svitlana', 'lcw', 'natalia'];
const COL = {marina: 'var(--c1)', anna: 'var(--c2)', svitlana: 'var(--c3)', lcw: 'var(--c4)', natalia: 'var(--c5)'};
const NAMES = {marina: 'Марина Васильєва', anna: 'Анна Воропаєва', svitlana: 'Світлана Степура', lcw: 'Іван Губченко', natalia: 'Свідрук Наталя'};
const toast = (t) => { const x = el('div', 'toast', t); document.body.append(x); setTimeout(() => x.remove(), 2600); };
const cur = () => S.A ? S.A.month : '';
const rowsOf = (m) => S.L.filter((r) => r.month === m).sort((a, b) => ORDER.indexOf(a.key) - ORDER.indexOf(b.key));

function company(m) {
  const L = rowsOf(m), d = L.filter((r) => r.kind === 'direction');
  const s = (k, rs = d) => rs.reduce((a, r) => a + (Number(r[k]) || 0), 0);
  const pl = d.filter((r) => r.plan);
  const isCur = m === cur();
  // утилізація: для закритого місяця — сам місяць, для поточного — минулий
  const um = isCur ? before(m) : m;
  const umr = S.M.filter((r) => r.month === um && r.key !== 'natalia');
  const t = s('tails_h'), tp = s('prev_tails_h');
  return {isCur, um, fact: s('fact'), prev_fact: s('prev_fact'), forecast: s('forecast', pl), plan: s('plan', pl),
    fpct: s('plan', pl) ? Math.round(s('forecast', pl) / s('plan', pl) * 100) : null,
    paid: s('paid_h', umr), util: s('fact', umr) ? Math.round(s('paid_h', umr) / s('fact', umr) * 100) : null,
    tails: t, tdelta: d.every((r) => r.prev_tails_h != null) ? Math.round(t - tp) : null, done: s('tails_done_h'), overdue: s('overdue')};
}

/* ---------- огляд ---------- */
const INI = (n) => n.split(' ').map((w) => w[0]).slice(0, 2).join('');
function ava(k) { const a = el('span', 'ava', INI(NAMES[k] || '?')); a.style.background = COL[k]; return a; }
function secHead(title, note) { const h = el('div', 'sh'); h.append(el('h2', null, title)); if (note) h.append(el('p', 'note', note)); return h; }

/* ---------- графіки ---------- */
const NS = 'http://www.w3.org/2000/svg';
const svgEl = (t, a) => { const e = document.createElementNS(NS, t); for (const k in a) e.setAttribute(k, a[k]); return e; };
function chartCard(title, note, draw) {
  const c = el('div', 'card'); c.append(el('h3', null, title), el('p', 'note', note));
  const lg = el('div', 'lg'); const ch = el('div', 'chart'); c.append(lg, ch);
  requestAnimationFrame(() => draw(ch, lg)); return c;
}
function tipOf(box) { let t = box.querySelector('.tip'); if (!t) { t = el('div', 'tip'); t.hidden = true; box.append(t); } return t; }
function showTip(box, ev, title, lines) {
  const t = tipOf(box); t.replaceChildren(el('div', 't', title));
  lines.forEach(([col, name, val]) => { const d = el('div'); const i = el('i', 'sw'); i.style.background = col; d.append(i, name + ': ' + val); t.append(d); });
  t.hidden = false; const r = box.getBoundingClientRect(); let x = ev.clientX - r.left + 12; if (x + t.offsetWidth > r.width) x = Math.max(0, ev.clientX - r.left - t.offsetWidth - 12);
  t.style.left = x + 'px'; t.style.top = Math.max(0, ev.clientY - r.top - 12) + 'px';
}
function legend(lg, keys) { lg.replaceChildren(); keys.forEach((k) => { const s = el('span'); const i = el('i', 'sw'); i.style.background = COL[k]; s.append(i, NAMES[k]); lg.append(s); }); }
function axes(svg, W, H, m, max, fmt, months, xc) {
  const y = (v) => H - m.b - (H - m.t - m.b) * v / max;
  const step = Math.pow(10, Math.floor(Math.log10(max / 4 || 1))); const nice = [1, 2, 2.5, 5, 10].map((k) => k * step).find((k) => max / k <= 5) || step * 10;
  for (let v = 0; v <= max; v += nice) { svg.append(svgEl('line', {x1: m.l, x2: W - m.r, y1: y(v), y2: y(v), stroke: 'var(--line)'})); const tx = svgEl('text', {x: m.l - 6, y: y(v) + 4, 'text-anchor': 'end', 'font-size': 11, fill: 'var(--muted)'}); tx.textContent = fmt(v); svg.append(tx); }
  months.forEach((mm) => { const tx = svgEl('text', {x: xc(mm), y: H - 6, 'text-anchor': 'middle', 'font-size': 11, fill: mm === S.month ? 'var(--ink)' : 'var(--muted)', 'font-weight': mm === S.month ? 700 : 400}); tx.textContent = ms(mm); svg.append(tx); });
  return y;
}
function frame(box, H) { box.querySelectorAll('svg').forEach((s) => s.remove()); const W = Math.max(280, box.clientWidth || 480); const svg = svgEl('svg', {width: '100%', viewBox: `0 0 ${W} ${H}`, role: 'img'}); box.prepend(svg); return {svg, W}; }
function hoursChart(box, lg) {
  const keys = ['marina', 'anna', 'svitlana', 'lcw']; legend(box.previousSibling, keys);
  const rows = S.M.filter((r) => keys.includes(r.key)); const months = [...new Set(rows.map((r) => r.month))].sort();
  const HH = 230, m = {l: 48, r: 8, t: 12, b: 24}; const {svg, W} = frame(box, HH);
  const tot = (mm) => rows.filter((r) => r.month === mm).reduce((a, r) => a + (r.fact || 0), 0), plan = (mm) => rows.filter((r) => r.month === mm).reduce((a, r) => a + (r.plan || 0), 0);
  const max = Math.max(1, ...months.map((mm) => Math.max(tot(mm), plan(mm)))) * 1.08;
  const bandW = (W - m.l - m.r) / months.length, bw = Math.min(34, bandW * 0.55); const xc = (mm) => m.l + bandW * (months.indexOf(mm) + 0.5);
  const y = axes(svg, W, HH, m, max, (v) => nf.format(v), months, xc);
  months.forEach((mm) => {
    let acc = 0; const part = rows.some((r) => r.month === mm && r.partial);
    if (mm === S.month) svg.append(svgEl('rect', {x: xc(mm) - bandW / 2 + 2, width: bandW - 4, y: m.t, height: HH - m.t - m.b, fill: 'var(--accbg)', rx: 6}));
    keys.forEach((k) => { const r = rows.find((x) => x.month === mm && x.key === k); const v = r ? r.fact || 0 : 0; if (!v) return;
      const rc = svgEl('rect', {x: xc(mm) - bw / 2, width: bw, y: y(acc + v), height: Math.max(0, y(acc) - y(acc + v)), fill: COL[k], opacity: part ? 0.4 : 0.9}); svg.append(rc); acc += v; });
    if (plan(mm)) svg.append(svgEl('line', {x1: xc(mm) - bw / 2 - 5, x2: xc(mm) + bw / 2 + 5, y1: y(plan(mm)), y2: y(plan(mm)), stroke: 'var(--ref)', 'stroke-width': 2, 'stroke-dasharray': '4 3'}));
    const hit = svgEl('rect', {x: xc(mm) - bandW / 2, width: bandW, y: m.t, height: HH - m.t - m.b, fill: 'transparent'});
    hit.addEventListener('mousemove', (ev) => showTip(box, ev, mf(mm) + (part ? ' (триває)' : ''), keys.map((k) => { const r = rows.find((x) => x.month === mm && x.key === k); return [COL[k], NAMES[k], H(r ? r.fact : null)]; }).concat(plan(mm) ? [['var(--ref)', 'План', H(plan(mm))]] : [])));
    hit.addEventListener('mouseleave', () => { tipOf(box).hidden = true; }); hit.addEventListener('click', () => setMonth(mm)); svg.append(hit);
  });
}
function lineChart(box, field, fmt, ref) {
  legend(box.previousSibling, ORDER);
  const rows = S.M.filter((r) => r[field] != null); const months = [...new Set(S.M.map((r) => r.month))].sort().filter((mm) => rows.some((r) => r.month === mm));
  const HH = 230, m = {l: 48, r: 14, t: 12, b: 24}; const {svg, W} = frame(box, HH);
  const max = Math.max(ref || 0, ...rows.map((r) => r[field]), 1) * 1.1;
  const xc = (mm) => months.length < 2 ? (W / 2) : m.l + 18 + (W - m.l - m.r - 36) * months.indexOf(mm) / (months.length - 1);
  if (months.includes(S.month)) svg.append(svgEl('rect', {x: xc(S.month) - 18, width: 36, y: m.t, height: HH - m.t - m.b, fill: 'var(--accbg)', rx: 6}));
  const y = axes(svg, W, HH, m, max, fmt, months, xc);
  if (ref) svg.append(svgEl('line', {x1: m.l, x2: W - m.r, y1: y(ref), y2: y(ref), stroke: 'var(--ref)', 'stroke-dasharray': '4 3'}));
  ORDER.forEach((k) => { const pts = rows.filter((r) => r.key === k).sort((a, b) => a.month.localeCompare(b.month)); if (!pts.length) return;
    svg.append(svgEl('path', {d: pts.map((r, i) => (i ? 'L' : 'M') + xc(r.month) + ',' + y(r[field])).join(''), fill: 'none', stroke: COL[k], 'stroke-width': 2, 'stroke-linecap': 'round', 'stroke-linejoin': 'round'}));
    pts.forEach((r) => svg.append(svgEl('circle', {cx: xc(r.month), cy: y(r[field]), r: 3.5, fill: r.partial ? 'var(--panel)' : COL[k], stroke: COL[k], 'stroke-width': 1.5}))); });
  months.forEach((mm) => { const hit = svgEl('rect', {x: xc(mm) - 24, width: 48, y: m.t, height: HH - m.t - m.b, fill: 'transparent'});
    hit.addEventListener('mousemove', (ev) => showTip(box, ev, mf(mm), ORDER.map((k) => rows.find((r) => r.key === k && r.month === mm)).filter(Boolean).map((r) => [COL[r.key], NAMES[r.key], fmt(r[field])])));
    hit.addEventListener('mouseleave', () => { tipOf(box).hidden = true; }); hit.addEventListener('click', () => setMonth(mm)); svg.append(hit); });
}
function miniUtil(box, key) {
  const pts = S.M.filter((r) => r.key === key && r.util != null).sort((a, b) => a.month.localeCompare(b.month)); if (!pts.length) return;
  const W = 320, H = 86, top = 18, base = 66; const svg = svgEl('svg', {width: '100%', viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': 'Утилізація по місяцях'}); box.replaceChildren(svg);

  pts.forEach((r, i) => { const w = Math.min(34, bw * 0.46), x = bw * i + (bw - w) / 2; const sel = r.month === S.month;
    svg.append(svgEl('rect', {x, width: w, y: y(r.util), height: Math.max(2, base - y(r.util)), rx: 4, fill: COL[key], opacity: r.partial ? 0.3 : sel ? 1 : 0.55}));
    const v = svgEl('text', {x: x + w / 2, y: y(r.util) - 5, 'text-anchor': 'middle', 'font-size': 11, 'font-weight': sel ? 700 : 500, fill: 'var(--ink)'}); v.textContent = r.util + '%'; svg.append(v);
    const t = svgEl('text', {x: x + w / 2, y: H - 4, 'text-anchor': 'middle', 'font-size': 11, fill: sel ? 'var(--ink)' : 'var(--muted)', 'font-weight': sel ? 700 : 400}); t.textContent = MS[+r.month.slice(5, 7) - 1]; svg.append(t); });

    r.append(ta);
  }
  const sv = el('div', 'saved'); sv.id = 'sv-' + mt.date + '_' + it.id; paintSaved(sv, mt.date + '_' + it.id); r.append(sv);
  return r;
}
/* Робочий календар України. Під час воєнного стану (діє до 29.01.2027) святкові дні — робочі, тож вихідні лише субота й неділя.
   Після його завершення враховуються державні свята; свято у вихідний переноситься на наступний робочий день. */
const MARTIAL_UNTIL = '2027-01-29';
const UA_HOLIDAYS = ['2026-12-25', '2027-01-01', '2027-03-08', '2027-05-01', '2027-05-02', '2027-05-08', '2027-06-20', '2027-06-28', '2027-07-15', '2027-08-24', '2027-10-01', '2027-12-25'];
const isoD = (d) => d.getUTCFullYear() + '-' + String(d.getUTCMonth() + 1).padStart(2, '0') + '-' + String(d.getUTCDate()).padStart(2, '0');
const UA_OFF = (() => { const off = new Set(UA_HOLIDAYS); UA_HOLIDAYS.forEach((h) => { const d = new Date(h + 'T00:00:00Z'); const w = d.getUTCDay(); if (w === 0 || w === 6) { do { d.setUTCDate(d.getUTCDate() + 1); } while ([0, 6].includes(d.getUTCDay()) || off.has(isoD(d))); off.add(isoD(d)); } }); return off; })(); // свято у вихідний переноситься на наступний робочий день
function isWorkday(iso) { const d = new Date(iso + 'T00:00:00Z'); const w = d.getUTCDay(); if (w === 0 || w === 6) return false; if (iso > MARTIAL_UNTIL && UA_OFF.has(iso)) return false; return true; }
function heldDay(slot) { const d = new Date(slot + 'T00:00:00Z'); while (!isWorkday(isoD(d))) d.setUTCDate(d.getUTCDate() + 1); return isoD(d); }
const heldOf = (mt) => mt.held || heldDay(mt.date);
function nextMeeting() { const today = (S.A && S.A.date) || isoD(new Date()); const d = new Date(today.slice(0, 8) + '01T00:00:00Z'); for (let k = 0; k < 4; k++) { for (const day of ['01', '15']) { const slot = isoD(d).slice(0, 8) + day; const h = heldDay(slot); if (h > today && !S.meetings.some((x) => x.date === slot)) return h; } d.setUTCMonth(d.getUTCMonth() + 1); } return null; }

function renderMonths() { const box = document.getElementById('months'); box.replaceChildren(); (S.monthsList || []).forEach((m) => { const b = el('button', null, MF[+m.slice(5, 7) - 1] + (m.slice(0, 4) !== (S.A ? S.A.month.slice(0, 4) : '') ? ' ' + m.slice(0, 4) : '')); b.type = 'button'; b.id = 'm-' + m; b.setAttribute('aria-pressed', m === S.month); if (m === cur()) { const d = el('span', 'dot'); d.title = 'Поточний місяць'; b.append(d); } b.onclick = () => setMonth(m); box.append(b); }); }
function setMonth(m) { S.month = m; renderMonths(); draw(); }
function draw() {
  const pg = document.getElementById('page'); pg.replaceChildren();
  document.querySelectorAll('.tab').forEach((b) => { b.setAttribute('aria-selected', b.dataset.t === S.tab); b.querySelectorAll('.badge').forEach((x) => x.remove()); });
  const mtTab = document.getElementById('tab-mt'); const prevOpen = S.meetings.reduce((a, mt) => a + (mt.items || []).filter((it) => { const k = markOf(mt.date, it.id); return k.assigned && !k.status; }).length, 0);
  if (prevOpen) { const b = el('span', 'badge', String(prevOpen)); b.title = 'Поставлені задачі без результату'; mtTab.append(b); }
  if (S.err) { pg.append(el('div', 'banner', S.err)); }
  if (!S.L.length) { if (!S.err) pg.append(el('p', 'muted', 'Завантаження даних…')); return; }
  if (S.tab === 'mt') meetingsPage(pg); else if (S.tab === 'tl') tailsPage(pg); else if (S.tab === 'en') engPage(pg); else if (S.tab === 'ps') presalePage(pg); else if (S.tab === 'how') howPage(pg); else overview(pg);
}
document.querySelectorAll('.tab').forEach((b) => b.addEventListener('click', () => { S.tab = b.dataset.t; try { localStorage.setItem('ow_tab', S.tab); } catch (e) {} draw(); }));
let rz; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(draw, 200); });

async function load(meta) {
  const U = (meta && meta.urls) || {};
  const get = async (k) => { if (!U[k]) throw new Error('немає файлу ' + k); const r = await fetch(U[k]); if (!r.ok) throw new Error(k + ' ' + r.status); return r.json(); };
  const [L, M, G, A, TT, HY, PD, HS, PS] = await Promise.all([get('leaders'), get('months'), get('managers'), get('about'), U.tails ? get('tails').catch(() => []) : Promise.resolve([]), U.hyg ? get('hyg').catch(() => []) : Promise.resolve([]), U.paid_daily ? get('paid_daily').catch(() => []) : Promise.resolve([]), U.hist ? get('hist').catch(() => []) : Promise.resolve([]), U.presale ? get('presale').catch(() => []) : Promise.resolve([])]);
  S.L = L; S.M = M; S.G = G; S.A = A[0]; S.T = TT; S.Hy = HY; S.Pd = PD; S.Hs = HS; S.Ps = PS;
  S.monthsList = (S.A.months || [...new Set(L.map((r) => r.month))]).slice().sort();
  if (!S.month || !S.monthsList.includes(S.month)) S.month = S.A.month;
  renderMonths();
  document.getElementById('asof').textContent = 'Дані на ' + dd(S.A.date) + ' · оновлюються щоночі о 02:00 з Worksection';
  draw();
}
(async () => {
  try {
    const cl = window.claude; const db = cl && cl.use ? await cl.use('db') : null;
    if (!db) { S.err = 'Дані не завантажились: відкрийте дашборд, увійшовши у свій акаунт claude.ai.'; draw(); return; }
    S.db = db;
    db.doc('data/meta').onSnapshot((snap) => { if (snap.exists) load(snap.data()).catch((e) => { S.err = 'Не вдалося завантажити дані: ' + e.message; draw(); }); else { S.err = 'Даних ще немає — вони з’являться після нічного оновлення.'; draw(); } }, () => { S.err = 'Немає доступу до даних дашборду.'; draw(); });
    db.collection('meetings').onSnapshot((q) => { S.meetings = q.docs.map((d) => Object.assign({date: d.id}, d.data())); draw(); }, () => {});
    db.collection('presale').onSnapshot((q) => { const m = {}; q.docs.forEach((d) => { m[d.id] = d.data(); }); S.pre = m; draw(); }, () => {});
    db.collection('eng').onSnapshot((q) => { S.eng = q.docs.map((d) => Object.assign({date: d.id}, d.data())); draw(); }, () => {});
    db.collection('marks').onSnapshot((q) => { const m = {}; q.docs.forEach((d) => { m[d.id] = d.data(); }); S.marks = m; draw(); }, () => {});
  } catch (e) { S.err = 'Помилка завантаження: ' + (e && e.message || e); draw(); }
})();
draw();
