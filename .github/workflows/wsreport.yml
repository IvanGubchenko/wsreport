name: wsreport

on:
  schedule:
    # 23:07 UTC = 01:07 по Киеву зимой (02:07 летом), в ночь на будний день
    - cron: "7 23 * * 0-4"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: wsreport
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: wsreport-public
    env:
      TZ: Europe/Kyiv
      WS_API_KEY: ${{ secrets.WS_API_KEY }}
      DASH_PASS: ${{ secrets.DASH_PASS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Расшифровать настройки и архив
        run: |
          test -n "$DASH_PASS" || { echo "Нет секрета DASH_PASS"; exit 1; }
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:DASH_PASS -in state.enc | tar xzf - --no-same-permissions
          chmod -R u+rwX config.json output
      - name: Выгрузка из Worksection
        run: python wsreport.py
      - name: Зашифровать и сохранить
        run: |
          tar czf - config.json output/history.json output/emp_history.json output/archive output/dash \
            | openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:DASH_PASS -out state.enc
          rm -rf output config.json
          git config user.name "wsreport-bot"
          git config user.email "wsreport-bot@users.noreply.github.com"
          git add state.enc
          git diff --cached --quiet || git commit -m "wsreport $(date +%F)"
          git push
